<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISO 27001 Evidence Evaluator</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { max-width: 880px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    .card { margin: 20px 0; padding: 24px; border: 1px solid #dce3ee; border-radius: 14px; background: white; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    select, input, button { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #c7d0df; border-radius: 8px; font: inherit; }
    button { margin-top: 18px; border: 0; color: white; background: #155eef; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #526078; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>ISO 27001 Evidence Evaluator</h1>
  <p class="muted">Chọn control, nạp bằng chứng PDF/DOCX và yêu cầu AI đánh giá.</p>
  <section class="card">
    <form id="evidence-form">
      <label for="control">Control ISO 27001</label>
      <select id="control" required></select>
      <label for="evidence-type">Loại bằng chứng</label>
      <select id="evidence-type" required></select>
      <label for="file">Tài liệu bằng chứng (PDF hoặc DOCX, tối đa 15 MB)</label>
      <input id="file" type="file" accept=".pdf,.docx" required>
      <button type="submit">Trích xuất và lưu bằng chứng</button>
    </form>
  </section>
  <section class="card">
    <button id="evaluate" type="button">Đánh giá control</button>
    <h2>Kết quả</h2>
    <div id="result" class="muted" aria-live="polite">Chưa có kết quả.</div>
  </section>
  <script>
    const controlSelect = document.querySelector("#control");
    const evidenceTypeSelect = document.querySelector("#evidence-type");
    const result = document.querySelector("#result");
    const evaluateButton = document.querySelector("#evaluate");

    function show(value, isError = false) {
      result.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      result.className = isError ? "error" : "";
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
      return body;
    }

    function updateEvidenceTypes() {
      const control = controlSelect.selectedOptions[0];
      const types = JSON.parse(control.dataset.evidenceTypes || "[]");
      evidenceTypeSelect.replaceChildren(...types.map((type) => new Option(type, type)));
    }

    async function loadControls() {
      try {
        const controls = await request("/api/controls");
        controlSelect.replaceChildren(...controls.map((control) => {
          const option = new Option(`${control.control_id} — ${control.name}`, control.control_id);
          option.dataset.evidenceTypes = JSON.stringify(control.expected_evidence_types);
          return option;
        }));
        updateEvidenceTypes();
      } catch (error) {
        show(error.message, true);
      }
    }

    controlSelect.addEventListener("change", updateEvidenceTypes);
    document.querySelector("#evidence-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData();
      form.append("control_id", controlSelect.value);
      form.append("evidence_type", evidenceTypeSelect.value);
      form.append("file", document.querySelector("#file").files[0]);
      try {
        show(await request("/api/evidence", { method: "POST", body: form }));
      } catch (error) {
        show(error.message, true);
      }
    });

    evaluateButton.addEventListener("click", async () => {
      evaluateButton.disabled = true;
      try {
        show(await request("/api/evaluate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ control_id: controlSelect.value })
        }));
      } catch (error) {
        show(error.message, true);
      } finally {
        evaluateButton.disabled = false;
      }
    });

    loadControls();
  </script>
</body>
</html>
